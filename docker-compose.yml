services:
  web:
    build: .
    container_name: gabbotv-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - gabbotv-data:/app/data

  updater:
    build: .
    container_name: gabbotv-updater
    restart: unless-stopped
    command: ["node", "dist/src/scheduler.js"]
    environment:
      UPDATE_INTERVAL_MS: "300000"
    volumes:
      - gabbotv-data:/app/data

volumes:
  gabbotv-data:
